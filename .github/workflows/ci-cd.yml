name: Groove Records CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # PHẦN 1: TỰ ĐỘNG KIỂM TRA LỖI TRÊN MÁY CHỦ CỦA GITHUB (CI)
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Tải code về môi trường test
      uses: actions/checkout@v3
    - name: 🐘 Cài đặt môi trường PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: 🔍 Kiểm tra lỗi cú pháp PHP (CI)
      run: find . -name "*.php" -exec php -l {} \;
    - name: 🐳 Kiểm tra file Docker Compose
      run: docker compose config

  # PHẦN 2: TỰ ĐỘNG TRIỂN KHAI VÀO MÁY ẢO UBUNTU CỦA BẠN (CD)
  continuous-deployment:
    needs: continuous-integration # Bắt buộc phần CI ở trên phải Pass xanh thì mới chạy phần này
    runs-on: self-hosted # Chạy thẳng bên trong con máy ảo Ubuntu của bạn!
    steps:
    - name: 📥 Kéo code mới nhất về Ubuntu
      uses: actions/checkout@v3

    - name: 🚀 Tự động Deploy bằng Docker (CD)
      run: |
        docker-compose down || true
        docker-compose up -d --build
        echo "✅ Đã tự động cài đặt code mới nhất vào máy ảo Ubuntu!"
